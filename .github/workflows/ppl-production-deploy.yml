name: PPL production deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: github.event.head_commit.message != 'Fix PPL production eligibility' && github.event.head_commit.message != 'Remove temporary PPL production workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix PPL eligibility for Doplňky & ostatní
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/CheckoutCartPage.tsx')
          s = p.read_text()
          old = "const normalizeCategory = (value: unknown) => String(value || '').trim().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');"
          new = old + "\nconst isPplEligibleCategory = (value: unknown) => { const c = normalizeCategory(value); return c === 'doplnky-ostatni' || c === 'doplnky-a-ostatni' || (c.includes('doplnky') && c.includes('ostatni')); };"
          if old not in s: raise SystemExit('Frontend normalizeCategory not found')
          s = s.replace(old, new, 1)
          old = "const pplEligible = cart.length > 0 && cart.every(item => normalizeCategory(item.product.category) === 'doplnky-ostatni');"
          new = "const pplEligible = cart.length > 0 && cart.every(item => isPplEligibleCategory(item.product.category));"
          if old not in s: raise SystemExit('Frontend pplEligible not found')
          s = s.replace(old, new, 1)
          s = s.replace('výhradně produkty z kategorie Doplňky.', 'výhradně produkty z kategorie Doplňky & ostatní.', 1)
          p.write_text(s)

          p = Path('api/orders.ts')
          s = p.read_text()
          old = "const normalizeCategory = (value: unknown) => String(value || '').trim().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');"
          new = old + "\nconst isPplEligibleCategory = (value: unknown) => { const c = normalizeCategory(value); return c === 'doplnky-ostatni' || c === 'doplnky-a-ostatni' || (c.includes('doplnky') && c.includes('ostatni')); };"
          if old not in s: raise SystemExit('Backend normalizeCategory not found')
          s = s.replace(old, new, 1)
          old = "const pplEligible = items.every((item: any) => normalizeCategory(item?.category) === 'doplnky-ostatni');"
          new = "const pplEligible = items.length > 0 && items.every((item: any) => isPplEligibleCategory(item?.category));"
          if old not in s: raise SystemExit('Backend pplEligible not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit eligibility fix
        run: |
          git config user.name "xSweatifyy"
          git config user.email "136999210+xSweatifyy@users.noreply.github.com"
          git add src/pages/CheckoutCartPage.tsx api/orders.ts
          if ! git diff --cached --quiet; then git commit -m "Fix PPL production eligibility"; git push; fi

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN secret is not configured; GitHub source fix was still committed."; exit 1; fi
          npx vercel@latest --prod --yes --token "$VERCEL_TOKEN"

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/ppl-production-deploy.yml || true
          if ! git diff --cached --quiet; then
            git config user.name "xSweatifyy"
            git config user.email "136999210+xSweatifyy@users.noreply.github.com"
            git commit -m "Remove temporary PPL production workflow"
            git push || true
          fi
