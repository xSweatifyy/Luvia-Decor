name: Deploy Luvia Decor to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vercel output
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_svKO1uqubGv3j91kFe236rMf
          VERCEL_PROJECT_ID: prj_zPWgNz1mGoxwtvgf8JHU2AlcxOHS

      - name: Deploy production to Vercel
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_svKO1uqubGv3j91kFe236rMf
          VERCEL_PROJECT_ID: prj_zPWgNz1mGoxwtvgf8JHU2AlcxOHS
