name: Trigger Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore broken admin source and repair status endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          admin = Path('src/pages/AdminPageLegacy.tsx')
          text = admin.read_text(encoding='utf-8') if admin.exists() else ''
          if not text.strip() or text.strip() == '__PLACEHOLDER__':
              text = subprocess.check_output(['git','show','f09c98de14528a2632c6c1506e6fe2b16c54c91d:src/pages/AdminPageLegacy.tsx'], text=True)
          old = '''const res = await fetch(`/api/orders/${orderId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });

      if (!res.ok) throw new Error('Aktualizace stavu selhala');
      const updatedOrder = await res.json();
      setOrders(prev => prev.map(order => order.id === orderId ? updatedOrder : order));'''
          new = '''const res = await fetch('/api/order-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status, adminUser })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data.error || `Aktualizace stavu selhala (${res.status})`);
      const updatedOrder = data.order || data;
      setOrders(prev => prev.map(order => order.id === orderId ? { ...order, ...updatedOrder, id: orderId } : order));'''
          if old in text:
              text = text.replace(old, new)
          admin.write_text(text, encoding='utf-8')
          p = Path('api/order-status.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("from '../src/server/order-status-email';", "from '../src/server/order-status-email.ts';")
          p.write_text(s, encoding='utf-8')
          checkout = Path('src/pages/CheckoutCartPage.tsx')
          cs = checkout.read_text(encoding='utf-8')
          cs = cs.replace('ZASILKOVNA:{pickup:72,address:99}', 'ZASILKOVNA:{pickup:129,address:179}')
          checkout.write_text(cs, encoding='utf-8')
          PY
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminPageLegacy.tsx api/order-status.ts src/pages/CheckoutCartPage.tsx
          if git diff --cached --quiet; then echo 'No source repairs needed.'; else git commit -m 'fix: restore admin and repair production build'; git push origin main; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Deploy production to Vercel
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_svKO1uqubGv3j91kFe236rMf
          VERCEL_PROJECT_ID: prj_zPWgNz1mGoxwtvgf8JHU2AlcxOHS
