name: Luvia gift card fix retry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[gift-card-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gift card fix
        shell: python
        run: |
          from pathlib import Path
          def patch(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in s: raise SystemExit(f'Missing text in {path}: {old[:80]}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          patch('api/orders.ts',[
            ("const DEFAULT_SHIPPING = { carriers: Object.fromEntries(ZASLAT_CARRIERS.map(c => [c, { enabled: true, address: FIXED_SHIPPING[c]?.address ?? 0, pickup_point: FIXED_SHIPPING[c]?.pickup ?? 0, box: FIXED_SHIPPING[c]?.pickup ?? 0 }])) as any, personalPickup: { enabled: true, price: 0, label: 'Osobní odběr – Kroměříž' } };","const DEFAULT_SHIPPING = { carriers: { ...Object.fromEntries(ZASLAT_CARRIERS.map(c => [c, { enabled: true, address: FIXED_SHIPPING[c]?.address ?? 0, pickup_point: FIXED_SHIPPING[c]?.pickup ?? 0, box: FIXED_SHIPPING[c]?.pickup ?? 0 }])), EMAIL: { enabled: true, address: 0, pickup_point: 0, box: 0 } } as any, personalPickup: { enabled: true, price: 0, label: 'Osobní odběr – Kroměříž' } };") ,
            ("    const shippingConfig = await getShippingConfig(); const deliveryMethod = String(delivery?.method || 'address'); const carrier = String(delivery?.carrier || '').toUpperCase();\n    if (deliveryMethod === 'personal_pickup') { if (!shippingConfig.personalPickup.enabled) return res.status(400).json({ error: 'Osobní odběr momentálně není dostupný.' }); }\n    else { const carrierConfig = shippingConfig.carriers[carrier] || null; if (!carrierConfig || carrierConfig.enabled === false) return res.status(400).json({ error: 'Zvolený dopravce není dostupný.' }); if (!['address','pickup_point','box'].includes(deliveryMethod)) return res.status(400).json({ error: 'Neplatný způsob doručení.' }); if ((deliveryMethod === 'pickup_point' || deliveryMethod === 'box') && !String(delivery?.pickupPoint || '').trim()) return res.status(400).json({ error: 'Je nutné vybrat výdejní místo nebo box.' }); if (deliveryMethod === 'address' && (!String(customer.street || '').trim() || !String(customer.city || '').trim() || !String(customer.zip || '').trim())) return res.status(400).json({ error: 'Pro doručení na adresu je nutné vyplnit celou adresu.' }); }","    const shippingConfig = await getShippingConfig(); const deliveryMethod = String(delivery?.method || 'address'); const carrier = String(delivery?.carrier || '').toUpperCase(); const isEmailDelivery = deliveryMethod === 'email' && carrier === 'EMAIL';\n    if (isEmailDelivery) { }\n    else if (deliveryMethod === 'personal_pickup') { if (!shippingConfig.personalPickup.enabled) return res.status(400).json({ error: 'Osobní odběr momentálně není dostupný.' }); }\n    else { const carrierConfig = shippingConfig.carriers[carrier] || null; if (!carrierConfig || carrierConfig.enabled === false) return res.status(400).json({ error: 'Zvolený dopravce není dostupný.' }); if (!['address','pickup_point','box'].includes(deliveryMethod)) return res.status(400).json({ error: 'Neplatný způsob doručení.' }); if ((deliveryMethod === 'pickup_point' || deliveryMethod === 'box') && !String(delivery?.pickupPoint || '').trim()) return res.status(400).json({ error: 'Je nutné vybrat výdejní místo nebo box.' }); if (deliveryMethod === 'address' && (!String(customer.street || '').trim() || !String(customer.city || '').trim() || !String(customer.zip || '').trim())) return res.status(400).json({ error: 'Pro doručení na adresu je nutné vyplnit celou adresu.' }); }"),
            ("    let shipping = deliveryMethod === 'personal_pickup' ? shippingConfig.personalPickup.price : 0;\n    if (deliveryMethod !== 'personal_pickup') { const country = String(customer.country || '').toLowerCase().includes('slov') ? 'SK' : 'CZ'; const fixed = fixedShipping(carrier, deliveryMethod, country, orderItems); if (fixed == null) return res.status(400).json({ error: carrier === 'PPL' ? 'PPL je dostupné pouze pro vybrané kategorie.' : carrier === 'ZASILKOVNA' && deliveryMethod === 'address' ? 'Zásilkovna na adresu je dostupná pouze do 5 kg.' : 'Zvolený způsob dopravy není pro tuto objednávku dostupný.' }); shipping = fixed; }","    let shipping = deliveryMethod === 'personal_pickup' || isEmailDelivery ? 0 : 0;\n    if (deliveryMethod !== 'personal_pickup' && !isEmailDelivery) { const country = String(customer.country || '').toLowerCase().includes('slov') ? 'SK' : 'CZ'; const fixed = fixedShipping(carrier, deliveryMethod, country, orderItems); if (fixed == null) return res.status(400).json({ error: carrier === 'PPL' ? 'PPL je dostupné pouze pro vybrané kategorie.' : carrier === 'ZASILKOVNA' && deliveryMethod === 'address' ? 'Zásilkovna na adresu je dostupná pouze do 5 kg.' : 'Zvolený způsob dopravy není pro tuto objednávku dostupný.' }); shipping = fixed; }"),
            ("    const normalizedDelivery = deliveryMethod === 'personal_pickup' ? { method: 'personal_pickup' } : { method: deliveryMethod, carrier, ...(deliveryMethod === 'pickup_point' || deliveryMethod === 'box' ? { pickupPoint: String(delivery?.pickupPoint || '').trim() } : {}), ...(delivery?.zaslatPickupBranch ? { zaslatPickupBranch: String(delivery.zaslatPickupBranch) } : {}), shippingBaseExVat: deliveryMethod === 'address' ? FIXED_SHIPPING[carrier]?.address : FIXED_SHIPPING[carrier]?.pickup, fuelSurchargeRate: 10.5, shippingIncludesVat: true };","    const normalizedDelivery = deliveryMethod === 'personal_pickup' ? { method: 'personal_pickup' } : isEmailDelivery ? { method: 'email', carrier: 'EMAIL', shippingBaseExVat: 0, fuelSurchargeRate: 0, shippingIncludesVat: true } : { method: deliveryMethod, carrier, ...(deliveryMethod === 'pickup_point' || deliveryMethod === 'box' ? { pickupPoint: String(delivery?.pickupPoint || '').trim() } : {}), ...(delivery?.zaslatPickupBranch ? { zaslatPickupBranch: String(delivery.zaslatPickupBranch) } : {}), shippingBaseExVat: deliveryMethod === 'address' ? FIXED_SHIPPING[carrier]?.address : FIXED_SHIPPING[carrier]?.pickup, fuelSurchargeRate: 10.5, shippingIncludesVat: true };"),
            ("const deliveryText = delivery.method === 'personal_pickup' ? 'Osobní odběr – Kroměříž' : delivery.method === 'box' ? `Box – ${delivery.carrier || ''}: ${pickupDetails}` : delivery.method === 'pickup_point' ? `Výdejní místo – ${delivery.carrier || ''}: ${pickupDetails}` : `Doručení na adresu – ${delivery.carrier || ''}`;","const deliveryText = delivery.method === 'email' ? 'Emailem – dárkovou kartu odešle administrátor po zpracování objednávky' : delivery.method === 'personal_pickup' ? 'Osobní odběr – Kroměříž' : delivery.method === 'box' ? `Box – ${delivery.carrier || ''}: ${pickupDetails}` : delivery.method === 'pickup_point' ? `Výdejní místo – ${delivery.carrier || ''}: ${pickupDetails}` : `Doručení na adresu – ${delivery.carrier || ''}`;")
          ])
          patch('api/coupons.ts',[(" if(action==='cancel-topup'&&req.method==='POST'){const topupId=String(req.body?.id||'');const r=await sql`UPDATE gift_card_topups SET status='cancelled' WHERE id=${topupId} AND status='pending' RETURNING id`;if(!r.length)return send(res,404,{error:'Žádost nebyla nalezena nebo již byla vyřízena.'});return send(res,200,{success:true})}"," if(action==='send-topup-email'&&req.method==='POST'){const topupId=String(req.body?.id||'');const rows=await sql`SELECT t.id,t.code,t.amount,t.email,t.status,c.remaining_value,c.value FROM gift_card_topups t JOIN coupons c ON c.id=t.coupon_id WHERE t.id=${topupId} LIMIT 1`;if(!rows.length)return send(res,404,{error:'Žádost o dobití nebyla nalezena.'});const t=rows[0];if(t.status!=='confirmed')return send(res,409,{error:'Nejdříve potvrďte dobití. E-mail lze odeslat až po potvrzení platby.'});const ok=await email(layout('Dobití dárkové karty',`<h1 style=\"font-size:24px\">Dárková karta byla dobita</h1><p>Dobrý den,<br>na Vaši dárkovou kartu <strong>${String(t.code)}</strong> bylo připsáno <strong>${Number(t.amount).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})} Kč</strong>.</p><p>Aktuální zůstatek: <strong>${Number(t.remaining_value??t.value??0).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})} Kč</p>`),String(t.email),`Dárková karta dobita · ${String(t.code)} | Luvia Decor`);if(!ok)return send(res,500,{error:'E-mail se nepodařilo odeslat. Zkontrolujte RESEND_API_KEY.'});return send(res,200,{success:true,sentAt:new Date().toISOString(),email:t.email})}\n if(action==='send-gift-email'&&req.method==='POST'){const code=String(req.body?.code||'').trim().toUpperCase();const to=String(req.body?.email||'').trim().toLowerCase();if(!code||!to||!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(to))return send(res,400,{error:'Zadejte platný kód a e-mail.'});const card=await findGift(code);if(!card||!card.active)return send(res,404,{error:'Dárková karta nebyla nalezena nebo je neaktivní.'});const ok=await email(layout('Dárková karta',`<h1 style=\"font-size:24px\">Vaše dárková karta Luvia Decor</h1><p>Dobrý den,<br>zasíláme Vám údaje k Vaší dárkové kartě.</p><div style=\"padding:18px;background:#faf8f5;border:1px solid #e7dfd6;border-radius:14px\"><strong>Kód karty:</strong> ${String(card.code)}<br><strong>Bezpečnostní kód:</strong> ${String(card.security_code||'')}<br><strong>Zůstatek:</strong> ${Number(card.remaining_value??card.value??0).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})} Kč</div><p>Odesláno ručně administrátorem po zpracování objednávky.</p>`),to,`Vaše dárková karta · ${String(card.code)} | Luvia Decor`);if(!ok)return send(res,500,{error:'E-mail se nepodařilo odeslat. Zkontrolujte RESEND_API_KEY.'});return send(res,200,{success:true,sentAt:new Date().toISOString(),email:to})}\n if(action==='cancel-topup'&&req.method==='POST'){const topupId=String(req.body?.id||'');const r=await sql`UPDATE gift_card_topups SET status='cancelled' WHERE id=${topupId} AND status='pending' RETURNING id`;if(!r.length)return send(res,404,{error:'Žádost nebyla nalezena nebo již byla vyřízena.'});return send(res,200,{success:true})}")])
          patch('src/components/GiftVoucherManager.tsx',[("import { Gift, Plus, Trash2, Power, RefreshCw, WalletCards, Check, X, Shuffle, Download, Palette } from 'lucide-react';","import { Gift, Plus, Trash2, Power, RefreshCw, WalletCards, Check, X, Shuffle, Download, Palette, Mail } from 'lucide-react';"),("  const recharge = async (v: Coupon) => {","  const sendGiftEmail = async (v: Coupon) => {\n    const to=window.prompt(`E-mail příjemce pro ${v.code}:`); if(to===null)return; if(!to.trim())return addToast('error','E-mail','E-mail příjemce je povinný.'); setBusy(v.id); try{const r=await fetch('/api/coupons?action=send-gift-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:v.code,email:to.trim()})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||'E-mail se nepodařilo odeslat.');addToast('success','Dárková karta odeslána',to.trim());}catch(e:any){addToast('error','Odeslání e-mailu',e?.message||'Chyba.');}finally{setBusy(null);}\n  };\n  const sendTopupEmail = async (t: Topup) => { setBusy(t.id); try{const r=await fetch('/api/coupons?action=send-topup-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:t.id})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||'E-mail se nepodařilo odeslat.');addToast('success','E-mail o dobití odeslán',t.email);}catch(e:any){addToast('error','Odeslání e-mailu',e?.message||'Chyba.');}finally{setBusy(null);} };\n\n  const recharge = async (v: Coupon) =>;"),("<Download className=\"w-3.5 h-3.5\" />PDF</button><button type=\"button\" disabled={busy === v.id} onClick={() => recharge(v)}","<Download className=\"w-3.5 h-3.5\" />PDF</button><button type=\"button\" disabled={busy === v.id} onClick={() => sendGiftEmail(v)} className=\"px-3 py-1.5 rounded-lg border text-[11px] font-semibold flex items-center gap-1\"><Mail className=\"w-3.5 h-3.5\" />Odeslat e-mailem</button><button type=\"button\" disabled={busy === v.id} onClick={() => recharge(v)}"),("<button type=\"button\" disabled={busy === t.id} onClick={() => confirmTopup(t)}","<button type=\"button\" disabled={busy === t.id || t.status !== 'confirmed'} onClick={() => sendTopupEmail(t)} className=\"px-3 py-1.5 rounded-lg bg-[#2D2723] text-white text-[11px] font-bold disabled:opacity-40\"><Mail className=\"w-3.5 h-3.5 inline mr-1\" />Odeslat e-mail</button><button type=\"button\" disabled={busy === t.id} onClick={() => confirmTopup(t)}")])
          Path('.github/workflows/luvia-fix-gift-card-email.yml').unlink(missing_ok=True)
          Path('.github/workflows/luvia-fix-gift-card-email-v2.yml').unlink(missing_ok=True)
      - name: Commit on latest main
        run: |
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/orders.ts api/coupons.ts src/components/GiftVoucherManager.tsx .github/workflows/luvia-fix-gift-card-email.yml .github/workflows/luvia-fix-gift-card-email-v2.yml
          git diff --cached --quiet && exit 0
          git commit -m "[gift-card-fix] fix gift card email delivery and manual sending"
          git push origin HEAD:main
