name: Fix gift card PDF and admin controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply final gift card fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        shell: python
        run: |
          from pathlib import Path
          import re
          def edit(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n==s: print('NO CHANGE',path)
              else: p.write_text(n,encoding='utf-8'); print('UPDATED',path)

          def gift_page(s):
              s=s.replace("if (!r.ok || !d?.valid) throw new Error(d?.error || 'Dárkovou kartu se nepodařilo ověřit.');", "if (!r.ok || !d?.valid || !d?.giftVoucher || Number(d.remainingValue) <= 0) throw new Error(d?.error || 'Dárková karta není platná nebo nemá zůstatek.');")
              return s
          edit('src/pages/GiftCardPage.tsx',gift_page)

          def gift_api(s):
              marker="const sql=neon(process.env.DATABASE_URL||'');"
              if 'REVOKED_GIFT_CARDS' not in s:
                  s=s.replace(marker,marker+"\nconst REVOKED_GIFT_CARDS=new Set(['LUVIA-ZQR5-Q7VF']);")
              s=s.replace("const card=await find(code);if(!card)return send(res,404,{valid:false,error:'Dárková karta nebyla nalezena.'});", "const card=await find(code);if(!card || REVOKED_GIFT_CARDS.has(code))return send(res,404,{valid:false,error:'Dárková karta byla zrušena nebo nebyla nalezena.'});")
              s=s.replace("const card=await find(code);if(!card||!card.active)return send(res,404,{success:false,error:'Dárková karta nebyla nalezena nebo je neaktivní.'});", "const card=await find(code);if(!card||REVOKED_GIFT_CARDS.has(code)||!card.active)return send(res,404,{success:false,error:'Dárková karta byla zrušena nebo nebyla nalezena.'});")
              return s
          edit('api/gift-card.ts',gift_api)

          def coupons(s):
              marker="const sql=neon(process.env.DATABASE_URL||'');"
              if 'REVOKED_GIFT_CARDS' not in s:
                  s=s.replace(marker,marker+"\nconst REVOKED_GIFT_CARDS=new Set(['LUVIA-ZQR5-Q7VF']);")
              # Reject the revoked card everywhere it can be validated or created.
              s=s.replace("const code=String(rawCode||'').trim().toUpperCase();const security=String(rawSecurity||'').trim().toUpperCase();", "const code=String(rawCode||'').trim().toUpperCase();const security=String(rawSecurity||'').trim().toUpperCase();if(REVOKED_GIFT_CARDS.has(code))return{status:404,body:{valid:false,error:'Dárková karta byla zrušena nebo nebyla nalezena.'}};")
              s=s.replace("const code=String(req.body?.code||'').trim().toUpperCase();const security=String(req.body?.securityCode||'').trim().toUpperCase();const amount=Number(req.body?.amount);", "const code=String(req.body?.code||'').trim().toUpperCase();const security=String(req.body?.securityCode||'').trim().toUpperCase();const amount=Number(req.body?.amount);if(REVOKED_GIFT_CARDS.has(code))return send(res,404,{error:'Dárková karta byla zrušena nebo nebyla nalezena.'});")
              s=s.replace("const code=String(req.body?.code||'').replace(/\\s+/g,' ').trim().toUpperCase();const type=", "const code=String(req.body?.code||'').replace(/\\s+/g,' ').trim().toUpperCase();if(REVOKED_GIFT_CARDS.has(code))return send(res,409,{error:'Tento kód dárkové karty byl zrušen a nelze jej použít.'});const type=")
              anchor=" if(!id)return send(res,400,{error:'Chybí ID slevového kódu.'});"
              insert=" if(action==='admin-adjust-balance'&&req.method==='POST'){const cardId=String(req.body?.id||'');const delta=Number(req.body?.delta);if(!cardId||!Number.isFinite(delta)||delta===0)return send(res,400,{error:'Neplatné ID nebo částka.'});const rows=await sql`UPDATE coupons SET remaining_value=GREATEST(0,COALESCE(remaining_value,value)+${delta}),active=CASE WHEN COALESCE(remaining_value,value)+${delta}>0 THEN TRUE ELSE FALSE END WHERE id=${cardId} AND note='gift-voucher' RETURNING id,code,type,value,active,created_at,note,category_ids,remaining_value`;if(!rows.length)return send(res,404,{error:'Dárková karta nebyla nalezena.'});return send(res,200,row(rows[0]))}\n if(action==='admin-set-active'&&req.method==='POST'){const cardId=String(req.body?.id||'');const active=Boolean(req.body?.active);if(!cardId)return send(res,400,{error:'Chybí ID karty.'});const rows=await sql`UPDATE coupons SET active=${active} WHERE id=${cardId} AND note='gift-voucher' RETURNING id,code,type,value,active,created_at,note,category_ids,remaining_value`;if(!rows.length)return send(res,404,{error:'Dárková karta nebyla nalezena.'});return send(res,200,row(rows[0]))}\n"
              if 'action===\'admin-adjust-balance\'' not in s and anchor in s:
                  s=s.replace(anchor,insert+anchor,1)
              return s
          edit('api/coupons.ts',coupons)

          def manager(s):
              s=s.replace("const host=document.createElement('div');host.style.cssText='position:fixed;left:-20000px;top:0;width:1600px;height:1130px;background:'", "const host=document.createElement('div');host.style.cssText='position:absolute;left:0;top:0;width:1600px;height:1130px;background:'")
              s=s.replace("const canvas=await html2canvas(host,{scale:2,useCORS:true,backgroundColor:d.bg,logging:false});const pdf=new jsPDF", "const canvas=await html2canvas(host,{scale:2,useCORS:true,backgroundColor:d.bg,logging:false});if(!canvas.width||!canvas.height)throw new Error('PDF se nepodařilo vytvořit – náhled má nulovou velikost.');const pdf=new jsPDF")
              s=s.replace("pdf.addImage(canvas.toDataURL('image/jpeg',.98),'JPEG',0,0,210,148,undefined,'FAST')", "const dataUrl=canvas.toDataURL('image/jpeg',.98);if(!dataUrl||dataUrl==='data:,')throw new Error('PDF se nepodařilo vytvořit.');pdf.addImage(dataUrl,'JPEG',0,0,210,148,undefined,'FAST')")
              s=s.replace("const toggle=async(v:Coupon)=>{setBusy(v.id);try{const r=await fetch(`/api/coupons?id=${encodeURIComponent(v.id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!v.active})});", "const toggle=async(v:Coupon)=>{setBusy(v.id);try{const r=await fetch('/api/coupons?action=admin-set-active',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:v.id,active:!v.active})});")
              s=s.replace("const r=await fetch(`/api/coupons?id=${encodeURIComponent(v.id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({remainingValue:Number(v.remainingValue||v.value)+a,active:true})});", "const r=await fetch('/api/coupons?action=admin-adjust-balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:v.id,delta:a})});")
              s=s.replace('Ručně tvořené dekorace a květinový ateliér Kroměříž','Ručně tvořené dekorace a květinový ateliér v Kroměříži')
              s=s.replace('Uplatnění v e-shopu Luvia Decor · Dárková karta je určena k čerpání hodnoty uvedené na kartě.','Platí pro nákupy v e-shopu Luvia Decor · hodnotu lze čerpat postupně až do jejího vyčerpání.')
              return s
          edit('src/components/GiftVoucherManager.tsx',manager)

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src api
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final gift card fixes'
          git push
