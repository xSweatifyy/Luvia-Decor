name: Fix payment details and money formatting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Apply QR and email payment fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply QR and email payment fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/CheckoutCartPage.tsx')
          s = p.read_text(encoding='utf-8')

          # Exact payment constants.
          s = re.sub(r"const DOMESTIC_ACCOUNT = '[^']*';", "const DOMESTIC_ACCOUNT = '963625003/5500';", s, count=1)
          s = re.sub(r"const INTERNATIONAL_IBAN = '[^']*';", "const INTERNATIONAL_IBAN = 'CZ96 5500 0000 0009 6362 5003';", s, count=1)
          s = re.sub(r"const PAYMENT_SWIFT = '[^']*';", "const PAYMENT_SWIFT = 'RZBCCZPP';", s, count=1)

          # Domestic QR: Czech QR payment generator with account, bank, exact amount, VS and order number message.
          domestic = '''const qrOf = (o: any) => {
            const orderNumber = String(o?.orderNumber || o?.id || '').trim();
            const amount = Number(o?.totalPrice || 0).toFixed(2);
            const vs = vsOf(o);
            const params = new URLSearchParams({ accountNumber: '963625003', bankCode: '5500', amount, currency: 'CZK', vs, message: orderNumber });
            return `https://api.paylibo.com/paylibo/generator/czech/image?${params.toString()}`;
          };'''
          s, n = re.subn(r"const qrOf = \(o: any\) => \{.*?\};", domestic, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('qrOf was not found')

          international = '''const qrInternationalOf = (o: any) => {
            const orderNumber = String(o?.orderNumber || o?.id || '').trim();
            const payload = `SPD*1.0*ACC:${INTERNATIONAL_IBAN.replace(/\\s/g, '')}*AM:${Number(o?.totalPrice || 0).toFixed(2)}*CC:CZK*X-VS:${vsOf(o)}*X-MSG:${orderNumber}`;
            return `https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=8&data=${encodeURIComponent(payload)}`;
          };'''
          s, n = re.subn(r"const qrInternationalOf = \(o: any\) => \{.*?\};", international, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('qrInternationalOf was not found')

          # Ensure every checkout money output is exactly two decimals.
          s = re.sub(r"toLocaleString\('cs-CZ'\)(?!\s*,)", "toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 })", s)
          s = re.sub(r'toLocaleString\("cs-CZ"\)(?!\s*,)', 'toLocaleString("cs-CZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 })', s)
          p.write_text(s, encoding='utf-8')

          # Every order email must show the current domestic account, IBAN and SWIFT.
          for name in ['server/resendService.ts', 'api/order-status-email.ts']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'CZ(?:45|96)[0-9 ]{20,30}', 'CZ96 5500 0000 0009 6362 5003', s)
              s = re.sub(r'RZ[A-Z0-9]{6,}', 'RZBCCZPP', s)
              # Add domestic account next to the IBAN in any email template that has an IBAN label.
              if '963625003/5500' not in s:
                  s = s.replace('<strong>IBAN:</strong>', '<strong>Číslo účtu (ČR):</strong> 963625003/5500<br>\n            <strong>IBAN:</strong>', 1)
              if '<strong>Číslo účtu (ČR):</strong>' not in s:
                  s = s.replace('<strong>IBAN:</strong> CZ96 5500 0000 0009 6362 5003', '<strong>Číslo účtu (ČR):</strong> 963625003/5500<br>            <strong>IBAN:</strong> CZ96 5500 0000 0009 6362 5003', 1)
              if 'SWIFT/BIC' not in s:
                  s = s.replace('CZ96 5500 0000 0009 6362 5003<br>', 'CZ96 5500 0000 0009 6362 5003<br>            <strong>SWIFT/BIC:</strong> RZBCCZPP<br>', 1)
              # Exact two-decimal formatting in email money values.
              s = re.sub(r'minimumFractionDigits:\s*\d+', 'minimumFractionDigits: 2', s)
              s = re.sub(r'maximumFractionDigits:\s*\d+', 'maximumFractionDigits: 2', s)
              p.write_text(s, encoding='utf-8')

          # Catch remaining bare Czech money formatters in application source.
          for p in Path('src').rglob('*'):
              if p.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                  continue
              s = p.read_text(encoding='utf-8')
              ns = re.sub(r"toLocaleString\('cs-CZ'\)(?!\s*,)", "toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 })", s)
              ns = re.sub(r'toLocaleString\("cs-CZ"\)(?!\s*,)', 'toLocaleString("cs-CZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 })', ns)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src server api
          git diff --cached --quiet && exit 0
          git commit -m 'Apply QR and email payment fix'
          git push
