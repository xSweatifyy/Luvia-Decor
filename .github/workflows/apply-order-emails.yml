name: Apply order email notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch order creation emails
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/[...all].ts')
          s = p.read_text()
          marker = '/* LUVIA_ORDER_EMAILS_V1 */'
          if marker in s:
              print('Order email patch already present; nothing to do.')
              raise SystemExit(0)
          old_import = "import { neon } from '@neondatabase/serverless';"
          if old_import not in s:
              raise SystemExit('Expected Neon import not found')
          s = s.replace(old_import, old_import + "\nimport { Resend } from 'resend';", 1)
          helper = r'''

/* LUVIA_ORDER_EMAILS_V1 */
const ORDER_EMAIL_FOOTER = `<div style="padding:24px 32px;background:#faf8f5;border-top:1px solid #eee5dc;text-align:center;color:#756b63;font-size:12px;line-height:1.8"><strong style="color:#302923">Luvia Decor</strong><br>Odpovědná osoba: Ladislav Pekárek<br>Adresa: U Rejdiště 3732/15, 767 01, Kroměříž<br>IČO: 29905061<br>Email: objednavky@luvia-decor.cz · podpora@luvia-decor.cz<br>Telefon: +420702345999</div>`;
function orderEmailEscape(value: unknown): string { return String(value ?? '').replace(/[&<>\"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;' }[char] || char)); }
function orderEmailMoney(value: unknown): string { return Number(value || 0).toLocaleString('cs-CZ'); }
function orderEmailVs(order: any): string { return String(order?.orderNumber || order?.id || '').replace(/\D/g, ''); }
function orderEmailQr(order: any): string {
  const iban = 'CZ45550000000000963625011';
  const amount = Number(order?.totalPrice || 0).toFixed(2);
  const vs = orderEmailVs(order);
  const note = String(order?.orderNumber || '').replace(/[^a-zA-Z0-9 ._-]/g, '').slice(0, 60);
  const payload = `SPD*1.0*ACC:${iban}*AM:${amount}*CC:CZK*X-VS:${vs}*X-MSG:${note}`;
  return `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(payload)}`;
}
function orderEmailLayout(title: string, content: string): string {
  return `<!doctype html><html lang="cs"><body style="margin:0;background:#f4f0eb;font-family:Arial,Helvetica,sans-serif;color:#302923"><div style="padding:32px 12px"><div style="max-width:680px;margin:0 auto;background:#fff;border:1px solid #e7dfd6;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(45,39,35,.08)"><div style="background:#211c18;padding:28px 32px;text-align:center"><div style="font-size:26px;letter-spacing:5px;font-weight:700;color:#faf6f0">LUVIA DECOR</div><div style="margin-top:7px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#c5a880">Květinový ateliér &amp; dekorace</div></div><div style="padding:32px"><div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#b08f65;font-weight:700;margin-bottom:8px">${orderEmailEscape(title)}</div>${content}</div>${ORDER_EMAIL_FOOTER}</div></div></body></html>`;
}
function orderEmailItems(order: any): string {
  const items = Array.isArray(order?.items) ? order.items : [];
  return items.length ? items.map((item: any) => `<tr><td style="padding:12px;border-bottom:1px solid #eee"><strong>${orderEmailEscape(item.title)}</strong><br><span style="font-size:11px;color:#8b8178">ID produktu: ${orderEmailEscape(item.productId || item.id || 'neuvedeno')}</span></td><td style="padding:12px;border-bottom:1px solid #eee;text-align:center">${Number(item.quantity || 1)}</td><td style="padding:12px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap">${orderEmailMoney(item.price)} Kč</td></tr>`).join('') : '<tr><td colspan="3" style="padding:12px;color:#777">Žádné položky</td></tr>';
}
async function sendNewOrderEmails(order: any) {
  const apiKey = process.env.RESEND_API_KEY;
  const customerEmail = String(order?.customer?.email || '').trim();
  const sellerEmail = String(process.env.ORDER_NOTIFY_EMAIL || 'objednavky@luvia-decor.cz').trim();
  if (!apiKey) throw new Error('Chybí RESEND_API_KEY ve Vercel Environment Variables.');
  if (!customerEmail) throw new Error('Objednávka nemá e-mail zákazníka.');
  const resend = new Resend(apiKey);
  const orderNumber = orderEmailEscape(order?.orderNumber || order?.id);
  const vs = orderEmailEscape(orderEmailVs(order));
  const customerName = orderEmailEscape(order?.customer?.fullName || 'zákazníku');
  const delivery = order?.delivery || {};
  const deliveryLabel = delivery.method === 'personal_pickup' ? 'Osobní odběr – Kroměříž' : delivery.method === 'box' ? `Box – ${orderEmailEscape(delivery.carrier || '')}` : delivery.method === 'pickup_point' ? `Výdejní místo – ${orderEmailEscape(delivery.carrier || '')}` : `Doručení na adresu – ${orderEmailEscape(delivery.carrier || '')}`;
  const items = orderEmailItems(order);
  const payment = `<div style="margin-top:24px;padding:20px;background:#faf8f5;border:1px solid #eee5dc;border-radius:14px"><div style="font-weight:700;margin-bottom:10px">Bankovní převod</div><div style="font-size:13px;line-height:1.8">Číslo účtu: <strong>963625011/5500</strong><br>IBAN: <strong>CZ45 5500 0000 0096 3625 011</strong><br>Variabilní symbol: <strong>${vs}</strong><br>Částka: <strong>${orderEmailMoney(order?.totalPrice)} Kč</strong><br>Poznámka pro příjemce: <strong>${orderNumber}</strong></div><div style="text-align:center;margin-top:16px"><img src="${orderEmailQr(order)}" width="220" height="220" alt="QR platba" style="display:inline-block;border:1px solid #e6ded5;border-radius:8px"></div></div>`;
  const customerContent = `<h1 style="margin:0 0 12px;font-size:25px">Objednávka byla přijata</h1><p style="font-size:15px;line-height:1.7">Dobrý den, ${customerName},<br>Vaše objednávka byla úspěšně přijata. Děkujeme za Váš nákup v Luvia Decor.</p><div style="margin:22px 0;padding:16px 18px;background:#faf8f5;border-radius:12px;font-size:13px;line-height:1.8"><strong>Objednávka:</strong> ${orderNumber}<br><strong>Variabilní symbol:</strong> ${vs}<br><strong>Doprava:</strong> ${deliveryLabel}</div><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="padding:10px;text-align:left;border-bottom:1px solid #ddd">Položka</th><th style="padding:10px">Ks</th><th style="padding:10px;text-align:right">Cena</th></tr></thead><tbody>${items}</tbody></table><p style="font-size:17px;text-align:right;margin:20px 0 0"><strong>Celkem: ${orderEmailMoney(order?.totalPrice)} Kč</strong></p>${payment}<p style="margin-top:24px;font-size:13px;color:#756b63">V případě dotazů nás kontaktujte na podpora@luvia-decor.cz.</p>`;
  const sellerContent = `<h1 style="margin:0 0 12px;font-size:25px">Nová objednávka</h1><div style="margin:20px 0;padding:16px 18px;background:#faf8f5;border-radius:12px;font-size:13px;line-height:1.8"><strong>Objednávka:</strong> ${orderNumber}<br><strong>Zákazník:</strong> ${orderEmailEscape(order?.customer?.fullName)}<br><strong>E-mail:</strong> ${orderEmailEscape(customerEmail)}<br><strong>Telefon:</strong> ${orderEmailEscape(order?.customer?.phone)}<br><strong>Doprava:</strong> ${deliveryLabel}</div><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="padding:10px;text-align:left;border-bottom:1px solid #ddd">Produkt</th><th style="padding:10px">Ks</th><th style="padding:10px;text-align:right">Cena</th></tr></thead><tbody>${items}</tbody></table><p style="font-size:17px;text-align:right;margin:20px 0 0"><strong>Celkem: ${orderEmailMoney(order?.totalPrice)} Kč</strong></p>`;
  const results = await Promise.allSettled([
    resend.emails.send({ from: 'Luvia Decor <objednavky@luvia-decor.cz>', to: customerEmail, replyTo: 'podpora@luvia-decor.cz', subject: `Objednávka ${order?.orderNumber} | Luvia Decor`, html: orderEmailLayout('Potvrzení objednávky', customerContent) }),
    resend.emails.send({ from: 'Luvia Decor <objednavky@luvia-decor.cz>', to: sellerEmail, replyTo: 'podpora@luvia-decor.cz', subject: `Nová objednávka · ${order?.orderNumber} | Luvia Decor`, html: orderEmailLayout('Nová objednávka', sellerContent) })
  ]);
  const failed = results.find((r: any) => r.status === 'rejected' || r.value?.error);
  if (failed) throw new Error(failed.status === 'rejected' ? (failed.reason?.message || 'Odeslání e-mailu selhalo.') : (failed.value?.error?.message || 'Resend odmítl odeslání e-mailu.'));
  return { customer: true, seller: true, sentAt: new Date().toISOString() };
}
'''
          anchor = "const sql = neon(process.env.DATABASE_URL || '');"
          s = s.replace(anchor, anchor + helper, 1)
          old = """        await sql`INSERT INTO orders (id, data) VALUES (${newOrder.id}, ${JSON.stringify(newOrder)}::jsonb)`;
        return res.status(201).json({ success: true, order: newOrder });"""
          new = """        await sql`INSERT INTO orders (id, data) VALUES (${newOrder.id}, ${JSON.stringify(newOrder)}::jsonb)`;
        try {
          const emailStatus = await sendNewOrderEmails(newOrder);
          newOrder.statusEmail = { sent: true, status: 'nova', ...emailStatus };
          newOrder.resendSent = true;
          await sql`UPDATE orders SET data = ${JSON.stringify(newOrder)}::jsonb WHERE id = ${newOrder.id}`;
        } catch (emailError: any) {
          console.error('New order email error:', emailError);
          newOrder.statusEmail = { sent: false, status: 'nova', error: emailError?.message || 'Odeslání e-mailu selhalo.', failedAt: new Date().toISOString() };
          newOrder.resendSent = false;
          newOrder.resendError = emailError?.message || 'Odeslání e-mailu selhalo.';
          await sql`UPDATE orders SET data = ${JSON.stringify(newOrder)}::jsonb WHERE id = ${newOrder.id}`;
        }
        return res.status(201).json({ success: true, order: newOrder });"""
          if old not in s:
              raise SystemExit('Expected order insert block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patched file and remove workflow
        shell: bash
        run: |
          if grep -q 'LUVIA_ORDER_EMAILS_V1' 'api/[...all].ts'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'api/[...all].ts'
            git rm '.github/workflows/apply-order-emails.yml'
            git commit -m "feat: send order emails on new orders"
            git push
          else
            echo 'Patch marker missing; refusing to commit.'
            exit 1
          fi