name: Fix Zaslat checkout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Zaslat checkout fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch checkout and shipment weight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/CheckoutCartPage.tsx')
          s=p.read_text()
          s=s.replace("import { DpdPickupWidget } from '../components/DpdPickupWidget';\n","")
          s=s.replace("import { PacketaPickupWidget } from '../components/PacketaPickupWidget';\n","")
          s=s.replace("import { PenguinBoxPickupWidget } from '../components/PenguinBoxPickupWidget';\n","")
          s=s.replace("const ZASLAT_CARRIERS: Record<string,string> = { PPL:'PPL', DPD:'DPD', GLS:'GLS', TOPTRANS:'TOPTRANS', UPS:'UPS', 'GLS-SK':'GLS-SK', LIFTAGO:'grid.online', FEDEX:'FedEx', WEDO:'One By Allegro', BALIKOVNA:'Balíkovna', ZASILKOVNA:'Zásilkovna', SPS:'SPS', PenguinBox:'PenguinBox' };\nconst ZASLAT_MAP_CARRIERS = new Set(['DPD','GLS','PPL','ZASILKOVNA','BALIKOVNA']);\n", "const ZASLAT_LABELS: Record<string,string> = { PPL:'PPL', DPD:'DPD', GLS:'GLS', TOPTRANS:'TOPTRANS', UPS:'UPS', 'GLS-SK':'GLS-SK', LIFTAGO:'grid.online', FEDEX:'FedEx', WEDO:'One By Allegro', BALIKOVNA:'Balíkovna', ZASILKOVNA:'Zásilkovna', SPS:'SPS' };\n")
          s=s.replace("const DEFAULT = { carriers: Object.fromEntries(Object.keys(ZASLAT_CARRIERS).map(k=>[k,{enabled:true,address:k==='PenguinBox'?0:0,pickup_point:k==='PenguinBox'?59:0,box:k==='PenguinBox'?59:0}])) as Record<string,Shipping>, personalPickup: { enabled: true, price: 0, label: 'Osobní odběr – Kroměříž' } };", "const DEFAULT = { carriers: {} as Record<string,Shipping>, personalPickup: { enabled: true, price: 0, label: 'Osobní odběr – Kroměříž' } };")
          s=s.replace("  const [point, setPoint] = useState<any>(null);", "  const [point, setPoint] = useState<any>(null);\n  const [penguinAddress, setPenguinAddress] = useState('');")
          s=s.replace("  const shippingConfig: any = { ...DEFAULT, ...rawShipping, carriers: { ...DEFAULT.carriers, ...(rawShipping.carriers || {}) }, personalPickup: { ...DEFAULT.personalPickup, ...(rawShipping.personalPickup || {}) } };\n  const entries: [string,Shipping][] = Object.entries(shippingConfig.carriers).filter(([n,c]: any)=>ZASLAT_CARRIERS[n] && c?.enabled !== false).map(([n,c]: any)=>[n,c]);", "  const shippingConfig: any = { ...DEFAULT, ...rawShipping, carriers: { ...(rawShipping.carriers || {}) }, personalPickup: { ...DEFAULT.personalPickup, ...(rawShipping.personalPickup || {}) } };\n  const entries: [string,Shipping][] = Object.keys(zaslatRates).map((n)=>[n, shippingConfig.carriers?.[n] || { enabled: true }] as [string,Shipping]);\n  if (destination === 'cz') entries.push(['PenguinBox', { enabled: true }]);")
          s=s.replace("packages:[{weight:1,width:20,height:20,length:20}]", "packages:[{weight:5,width:20,height:20,length:20}]")
          s=s.replace("setRatesError(e?.message || 'Zaslat.cz momentálně nevrátilo nabídku dopravy.');\n      addToast('error','Dopravu Zaslat se nepodařilo načíst',e?.message || 'PenguinBox je stále dostupný.');", "setRatesError(e?.message || 'Aktuální nabídku dopravy se nepodařilo načíst.');\n      addToast('error','Dopravu se nepodařilo načíst',e?.message || 'Zkuste to prosím znovu.');")
          s=s.replace("  const chooseDestination = (d: Destination) => { setDestination(d); setPoint(null); setPicker(false); setMethod('box'); setCarrier('PenguinBox'); };", "  const chooseDestination = (d: Destination) => { setDestination(d); setPoint(null); setPicker(false); setPenguinAddress(''); setMethod('address'); setCarrier(d === 'cz' ? 'PenguinBox' : ''); };")
          s=s.replace("  const chooseCarrier = (c: string) => { setCarrier(c); setPoint(null); setPicker(c === 'PenguinBox'); setMethod(c === 'PenguinBox' ? 'box' : 'address'); };", "  const chooseCarrier = (c: string) => { setCarrier(c); setPoint(null); setPenguinAddress(''); setPicker(false); setMethod(c === 'PenguinBox' ? 'box' : 'address'); };")
          s=s.replace("    if((method==='pickup_point'||method==='box')&&!point) return addToast('error','Vyberte výdejní místo','Vyberte výdejní místo nebo box.');", "    if(carrier==='PenguinBox' && destination!=='cz') return addToast('error','PenguinBox je pouze v ČR','Pro Slovensko vyberte přepravce dostupného pro Slovensko.');\n    if(carrier==='PenguinBox' && !penguinAddress.trim()) return addToast('error','Chybí adresa PenguinBoxu','Napište přesnou adresu PenguinBoxu.');\n    if((method==='pickup_point'||method==='box')&&carrier!=='PenguinBox'&&!point) return addToast('error','Vyberte výdejní místo','Vyberte výdejní místo nebo box.');")
          s=s.replace("delivery:method==='personal_pickup'?{method}:{method,carrier,country:destination==='sk'?'SK':'CZ',zaslatServiceId:selectedRate?.service_id,zaslatService:selectedRate?.service,zaslatRate:selectedRate?.price,zaslatPickupBranch:point?.code||point?.carrierPickupPointId||undefined,...(point?{pickupPoint:String(point.name||point.address||point.id||'Vybrané místo'),pickupPointId:point.id||point.carrierPickupPointId||undefined}: {})}", "delivery:method==='personal_pickup'?{method}:{method,carrier,country:destination==='sk'?'SK':'CZ',zaslatServiceId:selectedRate?.service_id,zaslatService:selectedRate?.service,zaslatRate:selectedRate?.price,zaslatPickupBranch:carrier==='PenguinBox'?undefined:(point?.code||point?.carrierPickupPointId||undefined),...(carrier==='PenguinBox'?{pickupPoint:penguinAddress.trim()}:(point?{pickupPoint:String(point.name||point.address||point.id||'Vybrané místo'),pickupPointId:point.id||point.carrierPickupPointId||undefined}: {}))}")
          s=s.replace("<button type=\"button\" onClick={()=>chooseDestination('cz')} className={option(destination==='cz')}><b>🇨🇿 Česká republika</b><span className=\"block text-[11px] text-[#8B8178] mt-1\">Zaslat.cz</span></button><button type=\"button\" onClick={()=>chooseDestination('sk')} className={option(destination==='sk')}><b>🇸🇰 Slovensko</b><span className=\"block text-[11px] text-[#8B8178] mt-1\">Zaslat.cz</span></button>", "<button type=\"button\" onClick={()=>chooseDestination('cz')} className={option(destination==='cz')}><b>🇨🇿 Česká republika</b></button><button type=\"button\" onClick={()=>chooseDestination('sk')} className={option(destination==='sk')}><b>🇸🇰 Slovensko</b></button>")
          s=s.replace("Načítám aktuální nabídky Zaslat.cz…", "Načítám aktuální nabídky dopravy…")
          s=s.replace("Zaslat.cz · dostupnost se ověřuje", "Dostupnost se ověřuje")
          s=s.replace("Zaslat.cz nabídku nyní nevrátilo. Dopravci zůstávají zobrazeni a po obnovení nabídky se doplní jejich aktuální cena.", "Aktuální nabídku dopravy se nepodařilo načíst.")
          s=s.replace("{isPenguin?'Vlastní box · 59 Kč':rate?`${Number(rate.price).toLocaleString('cs-CZ')} Kč · ${rate.service||'Zaslat'}`:'Zaslat.cz · dostupnost se ověřuje'}", "{isPenguin?'59 Kč · pouze ČR':rate?`${Number(rate.price).toLocaleString('cs-CZ')} Kč · ${rate.service||'Doprava'}`:'Dostupnost se ověřuje'}")
          s=s.replace("ZASLAT_CARRIERS[n]||n", "ZASLAT_LABELS[n]||n")
          s=s.replace("{carrier==='PenguinBox'?<button type=\"button\" onClick={()=>chooseMethod('box')} className={option(method==='box')}><b>Penguin Box</b><span className=\"block text-[11px] mt-1\">59 Kč · pouze do boxu</span></button>:ZASLAT_MAP_CARRIERS.has(carrier)?<button type=\"button\" onClick={()=>chooseMethod('pickup_point')} className={option(method==='pickup_point')}><b>Výdejní místo / box</b><span className=\"block text-[11px] mt-1\">Mapa Zaslat.cz</span></button>:null}", "{carrier==='PenguinBox'?<button type=\"button\" onClick={()=>chooseMethod('box')} className={option(method==='box')}><b>PenguinBox</b><span className=\"block text-[11px] mt-1\">59 Kč · pouze ČR</span></button>:null}")
          old="  {(method==='pickup_point'||method==='box')&&<div className=\"rounded-2xl bg-[#FAF7F2] border border-[#E5DCD2] p-4 text-xs\"><MapPin className=\"w-4 h-4 inline text-[#9A7B58] mr-2\"/>{point?<><b>Vybráno:</b> {String(point.name||point.address||point.id||'Místo')}</>:<>Mapa {carrier} se otevře automaticky.</>}</div>}\n  {picker&&method==='pickup_point'&&(carrier==='Zásilkovna'||carrier==='ZASILKOVNA'?<PacketaPickupWidget country={destination==='sk'?'sk':'cz'} onSelect={p=>{setPoint(p);setPicker(false);}}/>:carrier==='DPD'?<DpdPickupWidget initialCarrier=\"DPD\" onSelect={p=>{setPoint(p);setPicker(false);}}/>:null)}\n  {picker&&method==='box'&&carrier==='PenguinBox'&&<PenguinBoxPickupWidget onSelect={p=>{setPoint(p);setPicker(false);}}/>}"
          new="  {carrier==='PenguinBox'&&method==='box'&&<div className=\"space-y-3\"><label className=\"text-xs font-semibold\">Přesná adresa PenguinBoxu *</label><input required value={penguinAddress} onChange={e=>setPenguinAddress(e.target.value)} placeholder=\"Např. PenguinBox, Ulice 123, 767 01 Kroměříž\" className={input}/><p className=\"text-[11px] text-[#81766D]\">PenguinBox nemá mapu – adresu boxu napište ručně.</p></div>}\n  {(method==='pickup_point'||method==='box')&&carrier!=='PenguinBox'&&<div className=\"rounded-2xl bg-[#FAF7F2] border border-[#E5DCD2] p-4 text-xs\"><MapPin className=\"w-4 h-4 inline text-[#9A7B58] mr-2\"/>{point?<><b>Vybráno:</b> {String(point.name||point.address||point.id||'Místo')}</>:<>Vyberte výdejní místo nebo box.</>}</div>}"
          s=s.replace(old,new)
          s=s.replace("<div className=\"text-xs text-[#7B7067]\">Platba: bankovní převod · doprava přes Zaslat.cz</div>", "<div className=\"text-xs text-[#7B7067]\">Platba: bankovní převod</div>")
          p.write_text(s)

          p=Path('api/order-status.ts')
          s=p.read_text().replace("[{ weight: 1, width: 30, height: 20, length: 10 }]", "[{ weight: 5, width: 30, height: 20, length: 10 }]")
          p.write_text(s)
          PY

      - name: Verify patch
        run: |
          grep -q "weight:5,width:20,height:20,length:20" src/pages/CheckoutCartPage.tsx
          grep -q "penguinAddress" src/pages/CheckoutCartPage.tsx
          grep -q "weight: 5, width: 30" api/order-status.ts

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CheckoutCartPage.tsx api/order-status.ts
          git commit -m "Apply Zaslat checkout fixes" || true
          git rm .github/workflows/fix-zaslat-checkout.yml
          git commit -m "Remove temporary checkout fix workflow"
          git push