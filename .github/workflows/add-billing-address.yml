name: Add billing address to checkout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add billing address fields
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/CheckoutCartPage.tsx')
          s = p.read_text(encoding='utf-8')
          original = s
          marker = '  <div><label className="text-xs font-semibold">Poznámka <span className="font-normal text-[#9A8F85]">(nepovinná)</span></label>'
          billing_ui_marker = '<b>Fakturační adresa *</b>'
          if billing_ui_marker not in s:
              if marker not in s:
                  raise SystemExit('Checkout note section marker not found')
              billing = '''  <div><div className="flex items-center gap-2 mb-3"><MapPin className="w-4 h-4 text-[#9A7B58]"/><b>Fakturační adresa *</b></div><p className="text-[11px] text-[#81766D] mb-3">Adresa, která bude uvedena na faktuře. Všechna pole jsou povinná.</p><div className="space-y-3"><input required value={billingStreet} onChange={e=>setBillingStreet(e.target.value)} placeholder="Adresa *" autoComplete="billing street-address" className={input}/><div className="grid grid-cols-2 gap-2"><input required value={billingZip} onChange={e=>setBillingZip(e.target.value)} placeholder="PSČ *" autoComplete="billing postal-code" className={input}/><input required value={billingCity} onChange={e=>setBillingCity(e.target.value)} placeholder="Město *" autoComplete="billing address-level2" className={input}/></div></div></div>\n'''
              s = s.replace(marker, billing + marker, 1)

          if 'Doručovací adresa' not in s:
              delivery_marker = "  {method==='address'&&carrier!=='PenguinBox'&&<div className=\"space-y-3\"><input required value={street}"
              if delivery_marker in s:
                  s = s.replace(delivery_marker, "  {method==='address'&&carrier!=='PenguinBox'&&<div><div className=\"flex items-center gap-2 mb-3\"><MapPin className=\"w-4 h-4 text-[#9A7B58]\"/><b>Doručovací adresa</b></div><div className=\"space-y-3\"><input required value={street}", 1)

          if 'billingAddress:{street:billingStreet.trim()' not in s:
              raise SystemExit('Billing address is missing from order payload')
          if 'if(!billingStreet.trim()||!billingCity.trim()||!billingZip.trim())' not in s:
              raise SystemExit('Billing address validation is missing')
          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Billing checkout UI updated.')
          else:
              print('Billing checkout UI already present.')

      - name: Verify checkout source
        shell: bash
        run: |
          grep -q '<b>Fakturační adresa *</b>' src/pages/CheckoutCartPage.tsx
          grep -q 'value={billingStreet}' src/pages/CheckoutCartPage.tsx
          grep -q 'value={billingZip}' src/pages/CheckoutCartPage.tsx
          grep -q 'value={billingCity}' src/pages/CheckoutCartPage.tsx
          grep -q 'billingAddress:{street:billingStreet.trim()' src/pages/CheckoutCartPage.tsx
          grep -q 'Doručovací adresa' src/pages/CheckoutCartPage.tsx

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CheckoutCartPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Show required billing address fields in checkout'
          git push origin HEAD:main
