name: Add shipping as email order item

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch order email
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/orders.ts')
          s = p.read_text()
          old = "function itemsHtml(items: any[]): string { if (!items.length) return '<tr><td colspan=\"3\" style=\"padding:12px;color:#777\">Žádné položky</td></tr>'; return items.map((item: any) => `<tr><td style=\"padding:12px;border-bottom:1px solid #eee\"><strong>${escapeHtml(item.title)}</strong><br><span style=\"font-size:11px;color:#8b8178\">ID produktu: ${escapeHtml(item.productId || item.id || 'neuvedeno')}</span></td><td style=\"padding:12px;border-bottom:1px solid #eee;text-align:center\">${Number(item.quantity || 1)}</td><td style=\"padding:12px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap\">${money(item.price)} Kč</td></tr>`).join(''); }"
          new = "function itemsHtml(items: any[], shipping?: { carrier?: string; price?: number }): string { const productRows = items.map((item: any) => `<tr><td style=\"padding:12px;border-bottom:1px solid #eee\"><strong>${escapeHtml(item.title)}</strong><br><span style=\"font-size:11px;color:#8b8178\">ID produktu: ${escapeHtml(item.productId || item.id || 'neuvedeno')}</span></td><td style=\"padding:12px;border-bottom:1px solid #eee;text-align:center\">${Number(item.quantity || 1)}</td><td style=\"padding:12px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap\">${money(item.price)} Kč</td></tr>`).join(''); const carrierName = String(shipping?.carrier || '').trim() || 'Osobní odběr – Kroměříž'; const shippingRow = shipping ? `<tr><td style=\"padding:12px;border-bottom:1px solid #eee\"><strong>Doprava (${escapeHtml(carrierName)})</strong></td><td style=\"padding:12px;border-bottom:1px solid #eee;text-align:center\">1×</td><td style=\"padding:12px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap\">${money(shipping.price)} Kč</td></tr>` : ''; return productRows + shippingRow || '<tr><td colspan=\"3\" style=\"padding:12px;color:#777\">Žádné položky</td></tr>'; }"
          if old not in s:
              raise SystemExit('itemsHtml target not found')
          s = s.replace(old, new, 1)
          old_call = "${itemsHtml(items)}</tbody></table>"
          new_call = "${itemsHtml(items, { carrier: delivery.carrier, price: Number(order.shipping || 0) })}</tbody></table>"
          if old_call not in s:
              raise SystemExit('itemsHtml call target not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/orders.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add shipping as email order item"
          git push
