name: Fix gift cards and checkout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Fix gift cards and checkout')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gift cards, PDFs and checkout payment
        shell: python
        run: |
          from pathlib import Path
          def edit(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n!=s: p.write_text(n,encoding='utf-8'); print('UPDATED',path)
              else: print('NO CHANGE',path)
          def gift_page(s):
              s=s.replace("pdf.setFontSize(8); pdf.setTextColor(217,196,168); pdf.text('KVĚTINOVÝ ATELIÉR & DEKORACE',52,34);","pdf.setFontSize(8); pdf.setTextColor(217,196,168); pdf.text('KVĚTINOVÝ ATELIÉR · DEKORACE · KROMĚŘÍŽ',52,34);")
              s=s.replace("pdf.setTextColor(250,246,240); pdf.setFontSize(25); pdf.text('DÁRKOVÁ KARTA',105,76,{align:'center'});","pdf.setTextColor(250,246,240); pdf.setFontSize(25); pdf.text('DÁRKOVÁ KARTA',105,76,{align:'center'}); pdf.setTextColor(217,196,168); pdf.setFontSize(9); pdf.text('DARUJTE RADOST · VYBERTE SI KRÁSNĚ',105,66,{align:'center'});")
              s=s.replace("pdf.setFontSize(10); pdf.setTextColor(225,216,205); pdf.text(config.slogan||'S láskou tvořeno v Kroměříži',105,109,{align:'center'});","pdf.setFontSize(10); pdf.setTextColor(225,216,205); pdf.text(config.slogan||'Ručně tvořené dekorace a květinový ateliér v Kroměříži',105,109,{align:'center',maxWidth:165});")
              s=s.replace("pdf.setFontSize(8); pdf.text('Digitální karta · doručení e-mailem · kód a bezpečnostní kód obdržíte po zpracování objednávky.',105,124,{align:'center',maxWidth:175});","pdf.setFontSize(8); pdf.text('Digitální dárková karta · doručení e-mailem · kód a bezpečnostní kód obdržíte po zpracování objednávky.',105,124,{align:'center',maxWidth:175}); pdf.setTextColor(217,196,168); pdf.setFontSize(7); pdf.text('Dárkovou kartu lze čerpat postupně při více nákupech až do vyčerpání její hodnoty.',105,134,{align:'center',maxWidth:170});")
              return s
          edit('src/pages/GiftCardPage.tsx',gift_page)
          def balance(s):
              return s.replace("if (!r.ok || !d?.valid || !d.giftVoucher) throw new Error(d?.error || 'Dárková karta nebyla nalezena nebo ověřena.');","if (!r.ok || !d?.valid || !d.giftVoucher || Number(d.remainingValue) <= 0) throw new Error(d?.error || 'Dárková karta nebyla nalezena, je neaktivní nebo nemá zůstatek.');")
          edit('src/pages/GiftCardBalancePage.tsx',balance)
          revoked='LUVIA-ZQR5-Q7VF'
          def gift_api(s):
              m="const sql=neon(process.env.DATABASE_URL||'');"
              if 'const REVOKED_GIFT_CARDS' not in s: s=s.replace(m,m+f"\nconst REVOKED_GIFT_CARDS=new Set(['{revoked}']);")
              s=s.replace("const card=await find(code);if(!card)return send(res,404,{valid:false,error:'Dárková karta nebyla nalezena.'});","const card=await find(code);if(!card || REVOKED_GIFT_CARDS.has(code))return send(res,404,{valid:false,error:'Dárková karta byla zrušena nebo nebyla nalezena.'});")
              s=s.replace("const card=await find(code);if(!card||!card.active)return send(res,404,{success:false,error:'Dárková karta nebyla nalezena nebo je neaktivní.'});","const card=await find(code);if(!card||REVOKED_GIFT_CARDS.has(code)||!card.active)return send(res,404,{success:false,error:'Dárková karta byla zrušena nebo nebyla nalezena.'});")
              return s
          edit('api/gift-card.ts',gift_api)
          def coupons_api(s):
              m="const sql=neon(process.env.DATABASE_URL||'');"
              if 'const REVOKED_GIFT_CARDS' not in s: s=s.replace(m,m+f"\nconst REVOKED_GIFT_CARDS=new Set(['{revoked}']);")
              s=s.replace("const code=String(rawCode||'').trim().toUpperCase();const security=String(rawSecurity||'').trim().toUpperCase();","const code=String(rawCode||'').trim().toUpperCase();const security=String(rawSecurity||'').trim().toUpperCase();if(REVOKED_GIFT_CARDS.has(code))return{status:404,body:{valid:false,error:'Dárková karta byla zrušena nebo nebyla nalezena.'}};")
              s=s.replace("if(!code||value<=0)return send(res,400,{error:'Zadejte kód a kladnou hodnotu.'});","if(REVOKED_GIFT_CARDS.has(code))return send(res,409,{error:'Tento kód dárkové karty byl zrušen a nelze jej znovu použít.'});if(!code||value<=0)return send(res,400,{error:'Zadejte kód a kladnou hodnotu.'});")
              return s
          edit('api/coupons.ts',coupons_api)
          def manager(s):
              s=s.replace('Ručně tvořené dekorace a květinový ateliér Kroměříž','Ručně tvořené dekorace a květinový ateliér v Kroměříži')
              s=s.replace('Uplatnění v e-shopu Luvia Decor · Dárková karta je určena k čerpání hodnoty uvedené na kartě.','Platí pro nákupy v e-shopu Luvia Decor · hodnotu lze čerpat postupně až do jejího vyčerpání.')
              old="const canvas=await html2canvas(host,{scale:2,useCORS:true,backgroundColor:d.bg,logging:false});const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a5',compress:true});pdf.addImage(canvas.toDataURL('image/jpeg',.98),'JPEG',0,0,210,148,undefined,'FAST');pdf.save(`Luvia-Decor-Darkova-karta-${cardCode}.pdf`)"
              new="const canvas=await html2canvas(host,{scale:2,useCORS:true,backgroundColor:d.bg,logging:false});if(!canvas.width||!canvas.height)throw new Error('PDF náhled se nepodařilo vykreslit – plátno má nulovou velikost.');const dataUrl=canvas.toDataURL('image/jpeg',.98);if(!dataUrl||dataUrl==='data:,')throw new Error('PDF náhled se nepodařilo vytvořit.');const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a5',compress:true});pdf.addImage(dataUrl,'JPEG',0,0,210,148,undefined,'FAST');pdf.save(`Luvia-Decor-Darkova-karta-${cardCode}.pdf`)"
              return s.replace(old,new)
          edit('src/components/GiftVoucherManager.tsx',manager)
          Path('src/components/CheckoutPaymentMethods.tsx').write_text(r'''import React,{useEffect,useRef,useState}from'react';
import{CheckCircle2,CreditCard,Plus,RefreshCw,ShieldCheck,Trash2}from'lucide-react';
import{useApp}from'../context/AppContext';
type Card={code:string;securityCode:string;remainingValue:number};
const money=(n:number)=>Number(n||0).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2});
export const CheckoutPaymentMethods:React.FC<{total:number}>=({total})=>{const{page,addToast}=useApp();const[method,setMethod]=useState<'bank_transfer'|'gift_card'>('bank_transfer');const[cards,setCards]=useState<Card[]>([{code:'',securityCode:'',remainingValue:0}]);const[checking,setChecking]=useState<number|null>(null);const[allowRemainder,setAllowRemainder]=useState(false);const methodRef=useRef(method),cardsRef=useRef(cards),remainderRef=useRef(allowRemainder);methodRef.current=method;cardsRef.current=cards;remainderRef.current=allowRemainder;
useEffect(()=>{if(page!=='cart')return;const form=document.querySelector('main form')as HTMLFormElement|null;if(!form)return;const submit=(e:Event)=>{if(methodRef.current!=='gift_card')return;const valid=cardsRef.current.filter(c=>c.code&&c.securityCode&&c.remainingValue>0);const available=valid.reduce((s,c)=>s+c.remainingValue,0);if(!valid.length){e.preventDefault();e.stopImmediatePropagation();addToast('error','Dárková karta není ověřená','Zadejte číslo a bezpečnostní kód a kartu ověřte.');return}if(available+0.009<total&&!remainderRef.current){e.preventDefault();e.stopImmediatePropagation();addToast('error','Nedostatečný zůstatek',`Karty mají dohromady ${money(available)} Kč. Přidejte další kartu nebo povolte doplatek bankovním převodem.`)}};form.addEventListener('submit',submit,true);return()=>form.removeEventListener('submit',submit,true)},[page,total,addToast]);
useEffect(()=>{const nativeFetch=window.fetch.bind(window);const wrapped=async(input:RequestInfo|URL,init?:RequestInit)=>{const url=typeof input==='string'?input:input instanceof URL?input.toString():input.url;if(!url.includes('/api/orders')||(init?.method||'GET').toUpperCase()!=='POST')return nativeFetch(input,init);let next=init;if(methodRef.current==='gift_card'&&typeof init?.body==='string'){try{const p=JSON.parse(init.body);p.paymentMethod='gift_card';p.giftCardPayments=cardsRef.current.filter(c=>c.code&&c.securityCode&&c.remainingValue>0).map(c=>({code:c.code,securityCode:c.securityCode}));p.allowBankRemainder=Boolean(remainderRef.current);next={...init,body:JSON.stringify(p)}}catch{}}const response=await nativeFetch(input,next);if(!response.ok)return response;if(methodRef.current==='gift_card'){try{const payload=await response.clone().json();if(payload?.order?.id){const used=cardsRef.current.filter(c=>c.code&&c.securityCode&&c.remainingValue>0).map(c=>({code:c.code,securityCode:c.securityCode}));const pay=await nativeFetch('/api/gift-card-shipping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:payload.order.id,cards:used,allowBankRemainder:Boolean(remainderRef.current)})});const pd=await pay.json().catch(()=>null);if(!pay.ok||!pd?.order)throw new Error(pd?.error||'Platbu dárkovou kartou se nepodařilo dokončit.');return new Response(JSON.stringify({success:true,order:pd.order}),{status:200,headers:{'Content-Type':'application/json','Cache-Control':'no-store'}})}}catch(e:any){addToast('error','Platba dárkovou kartou se nedokončila',e?.message||'Zkuste to znovu.');return new Response(JSON.stringify({error:e?.message||'Platbu se nepodařilo dokončit.'}),{status:409,headers:{'Content-Type':'application/json'}})}}return response};window.fetch=wrapped as typeof window.fetch;return()=>{window.fetch=nativeFetch}},[addToast]);
const update=(i:number,key:'code'|'securityCode',v:string)=>setCards(p=>p.map((c,n)=>n===i?{...c,[key]:v.toUpperCase(),remainingValue:0}:c));
const verify=async(i:number)=>{const c=cards[i];if(!c.code||!c.securityCode)return addToast('error','Chybí údaje','Zadejte číslo dárkové karty a bezpečnostní kód.');setChecking(i);try{const r=await fetch(`/api/gift-card?action=validate&code=${encodeURIComponent(c.code)}&securityCode=${encodeURIComponent(c.securityCode)}&_=${Date.now()}`,{cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok||!d?.valid||Number(d.remainingValue)<=0)throw new Error(d?.error||'Dárková karta není platná.');setCards(p=>p.map((x,n)=>n===i?{...x,code:d.code,remainingValue:Number(d.remainingValue)}:x));addToast('success','Karta ověřena',`${d.code} · ${money(d.remainingValue)} Kč`)}catch(e:any){setCards(p=>p.map((x,n)=>n===i?{...x,remainingValue:0}:x));addToast('error','Ověření karty se nepodařilo',e?.message||'Zkontrolujte oba kódy.')}finally{setChecking(null)}};
if(page!=='cart')return null;return <div className="rounded-2xl border border-[#E5DCD2] bg-[#FCFAF7] p-4 space-y-3"><div className="flex items-center gap-2"><CreditCard className="w-4 h-4 text-[#9A7B58]"/><b>Platba *</b></div><div className="grid grid-cols-1 sm:grid-cols-2 gap-2"><button type="button" onClick={()=>setMethod('bank_transfer')} className={`rounded-2xl border p-4 text-left ${method==='bank_transfer'?'border-[#9A7B58] bg-[#FBF6EF]':'border-[#E8E0D8] bg-white'}`}><b>Bankovní převod</b><span className="block text-[11px] text-[#81766D] mt-1">Platba převodem podle údajů po objednávce.</span></button><button type="button" onClick={()=>setMethod('gift_card')} className={`rounded-2xl border p-4 text-left ${method==='gift_card'?'border-[#9A7B58] bg-[#FBF6EF]':'border-[#E8E0D8] bg-white'}`}><b>Dárková karta</b><span className="block text-[11px] text-[#81766D] mt-1">Použijte číslo karty a bezpečnostní kód.</span></button></div>{method==='gift_card'&&<div className="space-y-3">{cards.map((c,i)=><div key={i} className="rounded-xl border border-[#E5DCD2] bg-white p-3 space-y-2"><div className="flex items-center justify-between"><b className="text-xs">Dárková karta {i+1}</b>{cards.length>1&&<button type="button" onClick={()=>setCards(p=>p.filter((_,n)=>n!==i))} className="text-rose-600"><Trash2 className="w-4 h-4"/></button>}</div><div className="grid sm:grid-cols-2 gap-2"><input value={c.code} onChange={e=>update(i,'code',e.target.value)} placeholder="Číslo dárkové karty" className="rounded-xl border border-[#E3DACF] bg-[#FCFAF7] px-3 py-3 text-sm font-bold"/><input value={c.securityCode} onChange={e=>update(i,'securityCode',e.target.value)} placeholder="Bezpečnostní kód" className="rounded-xl border border-[#E3DACF] bg-[#FCFAF7] px-3 py-3 text-sm font-bold"/></div><button type="button" onClick={()=>verify(i)} disabled={checking===i} className="w-full rounded-xl bg-[#2D2723] text-white py-3 text-xs font-bold flex items-center justify-center gap-2">{checking===i?<RefreshCw className="w-4 h-4 animate-spin"/>:<ShieldCheck className="w-4 h-4"/>}Ověřit dárkovou kartu</button>{c.remainingValue>0&&<div className="flex items-center justify-between rounded-xl bg-emerald-50 border border-emerald-200 px-3 py-3 text-xs"><span className="flex items-center gap-2 text-emerald-700 font-semibold"><CheckCircle2 className="w-4 h-4"/>Ověřeno</span><b className="text-emerald-800">{money(c.remainingValue)} Kč</b></div>}</div>)}<button type="button" onClick={()=>setCards(p=>[...p,{code:'',securityCode:'',remainingValue:0}])} className="w-full rounded-xl border border-[#2D2723] py-3 text-xs font-bold flex items-center justify-center gap-2"><Plus className="w-4 h-4"/>Přidat další kartu</button><label className="flex items-start gap-2 text-xs rounded-xl bg-white border border-[#E5DCD2] p-3"><input type="checkbox" checked={allowRemainder} onChange={e=>setAllowRemainder(e.target.checked)} className="mt-0.5"/><span><b>Doplatek bankovním převodem</b><span className="block text-[#81766D] mt-1">Pokud kredity nestačí, zbytek objednávky uhradím bankovním převodem.</span></span></label></div>}</div>};
''',encoding='utf-8')
          def app(s):
              s=s.replace("import { GiftCardPaymentEnhancer } from './components/GiftCardPaymentEnhancer';\n",'')
              return s.replace('<GiftCardPaymentEnhancer/>','')
          edit('src/App.tsx',app)
          def checkout(s):
              s=s.replace("import { useApp } from '../context/AppContext';","import { useApp } from '../context/AppContext';\nimport { CheckoutPaymentMethods } from '../components/CheckoutPaymentMethods';")
              return s.replace('<div className="text-xs text-[#7B7067]">Platba: bankovní převod</div>','<CheckoutPaymentMethods total={total}/>')
          edit('src/pages/CheckoutCartPage.tsx',checkout)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src api .github/workflows/fix-gift-card-checkout-2026-09-10.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix gift cards and checkout payment"
          git push
