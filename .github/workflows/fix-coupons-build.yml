name: Fix coupons build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix TypeScript map callback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/coupons.ts')
          s = p.read_text()
          s2 = s.replace('rows.map(r=>row(r))', 'rows.map(r=>row(r,false))')
          if s2 == s:
              print('No change needed')
          else:
              p.write_text(s2)
              print('Fixed rows.map callback')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/coupons.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix coupons TypeScript build error'
            git push
          fi
