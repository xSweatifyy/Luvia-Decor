name: Fix Zaslat selection
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply destination carrier fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix carrier fallback for Slovakia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/CheckoutCartPage.tsx')
          s=p.read_text()
          old="useEffect(()=>{ if(!entries.some(([n])=>n===carrier)) { setCarrier('PenguinBox'); setMethod('box'); } },[entries.length,carrier]);"
          new="useEffect(()=>{ if(destination==='sk' && carrier==='PenguinBox') { setCarrier(''); setMethod('address'); setPoint(null); return; } if(carrier && entries.some(([n])=>n===carrier)) return; const first=entries.find(([n])=>n!=='PenguinBox'); if(first) { setCarrier(first[0]); setMethod('address'); setPoint(null); } else if(destination==='cz') { setCarrier('PenguinBox'); setMethod('box'); setPoint(null); } },[entries.length,carrier,destination]);"
          if old not in s: raise SystemExit('target effect not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Verify
        run: grep -q "destination==='sk' && carrier==='PenguinBox'" src/pages/CheckoutCartPage.tsx
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CheckoutCartPage.tsx
          git commit -m "Apply destination carrier fix"
          git rm .github/workflows/fix-zaslat-selection.yml
          git commit -m "Remove temporary selection workflow"
          git push